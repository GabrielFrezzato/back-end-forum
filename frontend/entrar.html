<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>entrar — QUADRO</title>
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body>
  <header class="cabecalho">
    <div class="cabecalho__interno">
      <a href="index.html" class="logo" style="color:inherit;text-decoration:none;">
        QUADRO<span class="logo__cursor">_▌</span>
      </a>
      <nav class="nav-auth" id="nav-auth"></nav>
    </div>
  </header>

  <main class="envelope">
    <div class="formulario-painel">
      <h1>entrar</h1>
      <p class="subtitulo">sintonize de volta na sua conta</p>

      <div class="mensagem-erro" id="erro-form" style="display:none;"></div>

      <form id="form-entrar">
        <div class="campo">
          <label for="campo-usuario">usuário</label>
          <input type="text" id="campo-usuario" required autocomplete="username">
        </div>
        <div class="campo">
          <label for="campo-senha">senha</label>
          <input type="password" id="campo-senha" required autocomplete="current-password">
        </div>
        <button class="botao" type="submit">[ entrar ]</button>
      </form>

      <p class="rodape-formulario">
        ainda não tem conta? <a href="registrar.html">registre-se</a>.<br>
        <span class="mono">dica: use "ana", "bento" ou "carla" com a senha "trocar123" para testar.</span>
      </p>
    </div>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
